[project]
authors = [{name = "CodeGandee"}]
description = "Reproducible deployment estimates for KV-cache offloading across server topologies."
dependencies = ["scipy>=1.18.1,<2", "mdutils>=1.8.1,<2", "ruff>=0.16.6,<0.17", "mkdocs-material>=9.7.7,<10", "mypy>=2.3.1,<3", "attrs>=26.1.0,<27", "omegaconf>=2.3.1,<3", "imageio>=2.37.4,<3", "pytest>=9.1.1,<10", "pandas>=2.3.2,<3", "rich>=14.1.0,<15"]
name = "kvcache-offload-deploy-estimate"
readme = "README.md"
requires-python = ">=3.13"
version = "0.1.0"

[project.scripts]
kv-estimate = "kvcache_offload_deploy_estimate.cli:main"
kv-shadowkv-sim = "kvcache_offload_deploy_estimate.sim_cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[tool.pixi.pypi-dependencies]
kvcache_offload_deploy_estimate = { path = ".", editable = true }

[tool.pixi.tasks]
test = "python -s -m pytest"
lint = "ruff check ."
format-check = "ruff format --check ."
typecheck = "mypy src tests"
check = { depends-on = ["lint", "format-check", "typecheck", "test"] }
docs = "mkdocs build --strict"
serve-docs = "mkdocs serve"

[tool.pixi.dependencies]
python = "3.13.*"

[tool.hatch.build.targets.wheel]
packages = ["src/kvcache_offload_deploy_estimate"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests/unit", "tests/integration"]

[tool.ruff]
exclude = ["extern", "site", "tmp"]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
